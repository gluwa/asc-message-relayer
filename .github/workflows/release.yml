name: Release

# Two triggers:
#  - push to main  → publish a moving dev image tagged `main` + `main-<sha>` (devnet iteration)
#  - tag `v*`      → publish `vX.Y.Z` + `latest` images and a GitHub Release with the linux
#                    binary attached
on:
  push:
    branches: [main]
    tags: ["v*"]

# Least-privilege default for the GITHUB_TOKEN; jobs opt into more as needed
# (github-release sets contents: write). Satisfies checkov CKV2_GHA_1.
permissions: read-all

env:
  # Docker Hub repo name, which had lagged the GitHub rename (usc- -> asc-). The old
  # gluwa/usc-message-relayer keeps its existing tags and is not deleted, so anything still
  # pinned to a published usc- tag (e.g. 0.6.0) keeps pulling; new builds publish here.
  IMAGE: gluwa/asc-message-relayer

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build & push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release (binary)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p message-relayer
      - name: Package
        run: |
          tar -C target/release -czf message-relayer-${{ github.ref_name }}-linux-amd64.tar.gz message-relayer
          sha256sum message-relayer-${{ github.ref_name }}-linux-amd64.tar.gz > message-relayer-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            message-relayer-${{ github.ref_name }}-linux-amd64.tar.gz
            message-relayer-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
