---
name: CI

# Structured to mirror gluwa/creditcoin3 .github/workflows/rust.yml as closely as
# the relayer workspace allows. The relayer is a plain Rust workspace (no wasm
# target, no protobuf codegen, no substrate node), so the wasm/protoc/coverage
# steps from creditcoin3 are intentionally omitted.

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  dependabot-coverage:
    name: Dependabot config coverage
    runs-on: ubuntu-26.04
    # Warns (and fails) if a Cargo.toml/Cargo.lock, Dockerfile*, workflow, or
    # other manifest exists in the tree but isn't registered in
    # .github/dependabot.yml.
    steps:
      - uses: actions/checkout@v7
      - name: Check dependabot.yml covers all ecosystems/directories
        run: bash .github/scripts/check-dependabot-coverage.sh

  image-os-sync:
    name: Docker runtime base matches CI runner OS
    runs-on: ubuntu-26.04
    # Fails if the Dockerfile runtime base (ubuntu:26.04) and every workflow
    # runs-on (ubuntu-26.04) drift apart, which risks a glibc mismatch between
    # the CI-built binary and the image it ships in.
    steps:
      - uses: actions/checkout@v7
      - name: Check Docker runtime base and CI runners are in sync
        run: bash .github/scripts/check-image-sync.sh

  rustc-version-match:
    name: Dockerfile rustc matches rust-toolchain.toml
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare rustc versions
        run: |
          set -euo pipefail
          version=$(grep channel rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+')
          if ! grep -q "FROM rust:$version" Dockerfile; then
            echo "::error::Dockerfile does not pin canonical rustc $version from rust-toolchain.toml"
            grep -i '^FROM rust:' Dockerfile
            exit 1
          fi
          echo "Dockerfile pins canonical rustc $version"

  cargo-fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-message-relayer

      - name: Check formatting
        uses: gluwa/cargo@dev
        with:
          command: fmt
          args: --all -- --check

      - name: Check TOML formatting
        run: |
          cargo install taplo-cli --locked
          taplo format --check

  cargo-clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          components: clippy, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-message-relayer

      - name: Print clippy's version
        uses: gluwa/cargo@dev
        with:
          command: clippy
          args: --version

      - name: Run Clippy
        uses: gluwa/cargo@dev
        with:
          command: clippy
          args: --workspace --all-targets --locked -- -D warnings

  cargo-machete:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-message-relayer

      - name: Execute cargo machete
        uses: bnjbvr/cargo-machete@main

  cargo-test:
    runs-on: ubuntu-26.04
    env:
      # Whether the ABI drift gate can run at all. asc-contracts is private, so the checkout needs
      # the org bot PAT — which is absent on Dependabot runs (they get no secrets) and in any fork.
      # Folded into a boolean here so the steps below can gate on it without touching the value.
      HAS_CONTRACTS_TOKEN: ${{ secrets.GLUWA_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-message-relayer

      - name: Build (locked)
        run: cargo build --workspace --locked

      # The ABI drift gate in write-ability/tests/abi_surface.rs recomputes every mirrored
      # selector/topic0 from our sol! types and compares it against the compiled contracts. It
      # skips when it has no artifacts to compare against, which meant it had never once run in
      # CI — the mirrors were correct by luck. Check the contracts out and compile them so the
      # gate has something to check, and set ABI_GATE_STRICT so it fails rather than skips if
      # this wiring ever breaks again.
      - name: Check out asc-contracts (for the ABI drift gate)
        if: env.HAS_CONTRACTS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: gluwa/asc-contracts
          ref: 434073943ec6828c3271bcf39114a04304e97d7f # main @ 2026-09-04 (#46 block-based timelock) — bump deliberately
          path: asc-contracts
          # asc-contracts is private; the default GITHUB_TOKEN is scoped to this repo only and
          # gets "Repository not found". Same org bot PAT creditcoin3's e2e uses cross-repo.
          token: ${{ secrets.GLUWA_BOT_TOKEN }}

      - name: Install Node.js
        if: env.HAS_CONTRACTS_TOKEN == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compile asc-contracts artifacts
        if: env.HAS_CONTRACTS_TOKEN == 'true'
        working-directory: ./asc-contracts
        # `npm install`, not `npm ci`: the committed lockfile can lag package.json at the pinned
        # SHA and `npm ci` rejects that. Only the compiled artifacts matter here.
        run: |
          npm install
          npx hardhat compile
          echo "ASC_CONTRACTS_DIR=$GITHUB_WORKSPACE/asc-contracts" >> "$GITHUB_ENV"
          echo "ABI_GATE_STRICT=1" >> "$GITHUB_ENV"

      # A skipped gate must be visible. Without the token there are no artifacts to compare
      # against, so ABI_GATE_STRICT is deliberately left unset and the test skips — but it says so
      # in the run summary rather than passing quietly, which is the failure mode this PR exists
      # to remove.
      - name: Warn that the ABI drift gate is skipping
        if: env.HAS_CONTRACTS_TOKEN != 'true'
        run: |
          echo "::warning title=ABI drift gate skipped::GLUWA_BOT_TOKEN is unavailable (Dependabot run, fork, or the secret is not configured), so asc-contracts could not be checked out and the Solidity<->Rust drift gate will skip. Add that secret to this repository to enforce it."

      - name: Run tests
        run: cargo test --workspace --locked

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-26.04
    # Image publishing happens in release.yml; this just proves the Dockerfile
    # stays buildable.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
