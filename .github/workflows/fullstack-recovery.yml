---
name: Full-stack recovery

# checkov:skip=CKV_GHA_7:Manual inputs select immutable source commits and testing artifacts; the callee verifies provenance and publishes no deployment artifacts.
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      creditcoin-ref:
        description: "Optional Creditcoin build checkout SHA; update source/run/artifact together"
        required: false
        type: string
      creditcoin-run-id:
        description: "Optional successful Creditcoin CI run ID; empty uses the tested pin"
        required: false
        type: string
      creditcoin-artifact-id:
        description: "Optional binary-for-testing-ci artifact ID from that run"
        required: false
        type: string
      contracts-ref:
        description: "Optional full asc-contracts commit SHA; empty uses the tested pin"
        required: false
        type: string

permissions: read-all

concurrency:
  # A reusable workflow inherits github.workflow from this caller. Keep this prefix
  # distinct from the callee's concurrency group so a run cannot cancel itself.
  group: relayer-fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Real stack / delivery and durable restart
    # This SHA pins the workflow definition. The source/run/artifact pins below identify
    # the existing native build and must be updated together after its full CI succeeds.
    uses: gluwa/creditcoin3/.github/workflows/write-ability-e2e.yml@b688d601d8bb5f3f35e14293ff0d233010791873
    with:
      # The native producer checked out this PR merge commit, not the workflow definition SHA.
      creditcoin-ref: ${{ inputs.creditcoin-ref || '104ee11745da0e495de845a6074fe7fa1d799c2d' }}
      creditcoin-run-id: ${{ inputs.creditcoin-run-id || '39255393286' }}
      creditcoin-artifact-id: ${{ inputs.creditcoin-artifact-id || '12189850200' }}
      relayer-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      # Exercise the candidate itself, rather than a moving branch or the synthetic merge SHA.
      relayer-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      contracts-ref: ${{ inputs.contracts-ref || '9e8a9e603d964b598b0d74bb8f4e5966ef75d17e' }}
      scenarios: happy-path,durable-restart
    secrets:
      # Private contracts are a required dependency. The callee fails explicitly if this
      # secret is unavailable, including forks and Dependabot; it never reports a skipped pass.
      GLUWA_BOT_TOKEN: ${{ secrets.GLUWA_BOT_TOKEN }}
